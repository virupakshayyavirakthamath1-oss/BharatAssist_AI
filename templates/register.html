{% extends "base.html" %}
{% block content %}<div class="auth"><h1>Create account</h1><form method="post">
<input name="name" placeholder="Full name" required>
<input name="email" type="email" placeholder="Email" required>
<input name="password" type="password" placeholder="Password (6+ characters)" required>
<button class="btn">Register</button></form><p>Already have an account? <a href="{{url_for('login')}}">Login</a></p></div>{% endblock %}
