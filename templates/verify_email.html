{% extends "base.html" %}
{% block content %}
<div class="auth">
<h1>Verify your email</h1>
<p>We sent a 6-digit code to <strong>{{ email }}</strong>.</p>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" required>
<button class="btn">Verify Email</button>
</form>
<form method="post" action="{{ url_for('resend_otp') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<button class="btn" type="submit">Resend Code</button>
</form>
<p><a href="{{ url_for('login') }}">Back to login</a></p>
</div>
{% endblock %}
